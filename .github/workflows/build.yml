name: Build FirstHawk

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/FirstHawk/FirstHawk.csproj
      - name: Build
        run: dotnet publish src/FirstHawk/FirstHawk.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload FirstHawk
        uses: actions/upload-artifact@v4
        with:
          name: FirstHawk-Windows-x64
          path: publish/
          if-no-files-found: error
